name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and stage release packages
    runs-on: ubuntu-22.04
    env:
      BUILD_IMAGE: ghcr.io/jeffreybergier/altivec-intelligence:latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Resolve release tag
        id: release_ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag_name }}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+([.][0-9]+){0,2}$ ]]; then
            echo "Release tag must be v followed by a numeric version: ${tag}" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_ref.outputs.release_tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify release checkout
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$actual_sha" != "$tag_sha" ]]; then
            echo "Checked out ${actual_sha}, expected release commit ${tag_sha}." >&2
            exit 1
          fi
          echo "RELEASE_SHA=$actual_sha" >> "$GITHUB_ENV"

      - name: Pull pinned build image
        run: docker pull "$BUILD_IMAGE"

      - name: Check configured plist versions
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            -e RELEASE_TAG \
            -v "${{ github.workspace }}:/repo/user" \
            -w /repo/user \
            "$BUILD_IMAGE" \
            -lc 'altivec-release ci-env "$RELEASE_TAG"' > release.env
          cat release.env >> "$GITHUB_ENV"
          cat release.env

      - name: Fetch and preflight secret SDK inputs
        env:
          ALTIVEC_SDK_MACOS_105_URL: ${{ secrets.ALTIVEC_SDK_MACOS_105_URL }}
          ALTIVEC_SDK_MACOS_113_URL: ${{ secrets.ALTIVEC_SDK_MACOS_113_URL }}
          ALTIVEC_SDK_IPHONEOS_84_URL: ${{ secrets.ALTIVEC_SDK_IPHONEOS_84_URL }}
        run: |
          set -euo pipefail
          archive_dir="${RUNNER_TEMP}/.altivec-sdk"
          mkdir -p "$archive_dir"
          chmod 0700 "$archive_dir"

          for archive_input in \
              'ALTIVEC_SDK_MACOS_105_URL|MacOSX10.5.sdk.tar.xz' \
              'ALTIVEC_SDK_MACOS_113_URL|MacOSX11.3.sdk.tar.xz' \
              'ALTIVEC_SDK_IPHONEOS_84_URL|iPhoneOS8.4.sdk.tar.gz'; do
            IFS='|' read -r secret_name filename <<< "$archive_input"
            archive_url="${!secret_name:-}"
            if [[ ! "$archive_url" =~ ^https://[^[:space:]]+$ ]]; then
              echo "${secret_name} must be configured as an HTTPS repository secret." >&2
              exit 1
            fi
            temporary="${archive_dir}/${filename}.part"
            if ! curl \
                --fail \
                --location \
                --silent \
                --show-error \
                --proto '=https' \
                --proto-redir '=https' \
                --retry 5 \
                --retry-delay 2 \
                --retry-all-errors \
                --connect-timeout 30 \
                --output "$temporary" \
                "$archive_url"; then
              rm -f -- "$temporary"
              echo "Failed to fetch ${filename}." >&2
              exit 1
            fi
            mv "$temporary" "${archive_dir}/${filename}"
          done

          docker run --rm \
            --entrypoint altivec-sdk \
            -e ALTIVEC_SDK_ARCHIVE_DIR=/altivec-sdk \
            -v "${archive_dir}:/altivec-sdk:ro" \
            "$BUILD_IMAGE" \
            preflight

      - name: Build configured targets and stage assets
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            -e IS_SANDBOX=1 \
            -e ALTIVEC_SDK_ARCHIVE_DIR=/altivec-sdk \
            -e RELEASE_VERSION \
            -v "${RUNNER_TEMP}/.altivec-sdk:/altivec-sdk:ro" \
            --mount type=volume,target=/osxcross/legacy/target/SDK \
            --mount type=volume,target=/osxcross/modern/SDK \
            -v "${{ github.workspace }}:/repo/user" \
            -w /repo/user \
            "$BUILD_IMAGE" \
            -lc 'altivec-sdk install && altivec-release build && altivec-release stage "$RELEASE_VERSION"'
          ls -lh dist

      - name: Validate staged release assets
        run: |
          set -euo pipefail
          mac_asset="dist/Strappy-${RELEASE_VERSION}-macOS.zip"
          ios_asset="dist/Strappy-${RELEASE_VERSION}-iOS.deb"
          test -s "$mac_asset"
          test -s "$ios_asset"
          unzip -t "$mac_asset" >/dev/null
          dpkg-deb --info "$ios_asset" >/dev/null
          package_version="$(dpkg-deb -f "$ios_asset" Version)"
          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "Debian package version ${package_version} does not match release version ${RELEASE_VERSION}." >&2
            exit 1
          fi
          sha256sum "$mac_asset" "$ios_asset"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_SHA" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
