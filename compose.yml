services:

## Altivec Intelligence / Native Dev and Testing

  altivec:
    image: ghcr.io/jeffreybergier/altivec-intelligence:latest
    working_dir: /repo/Strappy
    environment:
      ALTIVEC_SDK_ARCHIVE_DIR: /altivec-sdk
    volumes:
      - .:/repo/Strappy
      - ~/.altivec:/root
      - ${ALTIVEC_SDK_HOST_DIR:-./.altivec-sdk}:/altivec-sdk:ro
      - cache:/cache
      - altivec-sdk-legacy:/osxcross/legacy/target/SDK
      - altivec-sdk-modern:/osxcross/modern/SDK

  altivec-sdk:
    profiles:
      - tools
    image: ghcr.io/jeffreybergier/altivec-intelligence:latest
    environment:
      ALTIVEC_SDK_ARCHIVE_DIR: /altivec-sdk
    volumes:
      - ${ALTIVEC_SDK_HOST_DIR:-./.altivec-sdk}:/altivec-sdk:ro
      - altivec-sdk-legacy:/osxcross/legacy/target/SDK
      - altivec-sdk-modern:/osxcross/modern/SDK
    entrypoint: altivec-sdk

  altivec-intelligence:
    image: ghcr.io/jeffreybergier/altivec-intelligence:latest
    stdin_open: true
    tty: true
    environment:
      - IS_SANDBOX=1
      - TERM=xterm-256color
      - COLORTERM=${COLORTERM:-}
      - ALTIVEC_SDK_ARCHIVE_DIR=/altivec-sdk
    working_dir: /repo/Strappy
    volumes:
      - .:/repo/Strappy
      - ~/.altivec:/root
      - ${ALTIVEC_SDK_HOST_DIR:-./.altivec-sdk}:/altivec-sdk:ro
      - cache:/cache
      - altivec-sdk-legacy:/osxcross/legacy/target/SDK
      - altivec-sdk-modern:/osxcross/modern/SDK
    entrypoint: /bin/bash
    command: -lc "altivec-chooser"

  make:
    profiles:
      - tools
    image: ghcr.io/jeffreybergier/altivec-intelligence:latest
    working_dir: /repo/Strappy
    environment:
      ALTIVEC_SDK_ARCHIVE_DIR: /altivec-sdk
    volumes:
      - .:/repo/Strappy
      - ~/.altivec:/root
      - ${ALTIVEC_SDK_HOST_DIR:-./.altivec-sdk}:/altivec-sdk:ro
      - cache:/cache
      - altivec-sdk-legacy:/osxcross/legacy/target/SDK
      - altivec-sdk-modern:/osxcross/modern/SDK
    entrypoint: ["make", "-C", "source"]

## WebAssembly Containers Developer and Testing

  wasm-build:
    profiles:
      - tools
    image: emscripten/emsdk:6.0.8
    working_dir: /repo/Strappy
    volumes:
      - .:/repo/Strappy
    entrypoint: ["make", "-C", "source/web"]

  web:
    image: nginx:1.31.4-alpine3.24
    ports:
      - "127.0.0.1:8765:80"
    volumes:
      - ./source/web/build-release:/usr/share/nginx/html:ro
      - ./source/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  browser-test:
    profiles:
      - tools
    image: selenium/standalone-chromium:4.35.0-20250909
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:4444/status >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

  web-test:
    profiles:
      - tools
    image: emscripten/emsdk:6.0.8
    working_dir: /repo/Strappy
    environment:
      STRAPPY_WEB_BASE_URL: http://web
      STRAPPY_WEBDRIVER_URL: http://browser-test:4444
    volumes:
      - .:/repo/Strappy
    depends_on:
      web:
        condition: service_started
      browser-test:
        condition: service_healthy
    entrypoint: ["make", "-C", "source/web"]
    command: ["test"]

volumes:
  cache:
  altivec-sdk-legacy:
  altivec-sdk-modern:
